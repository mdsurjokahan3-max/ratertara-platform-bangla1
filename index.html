<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Rater Tara Image Upload</title>


<link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>


<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    font-family:
    "Hind Siliguri",
    sans-serif;

    min-height:100vh;

    padding:20px 12px;

    background:
    linear-gradient(
        135deg,
        #f5efff,
        #ffffff
    );

    color:#222;
}


.app{

    width:100%;

    max-width:520px;

    margin:auto;

    background:#fff;

    border-radius:24px;

    overflow:hidden;

    box-shadow:
    0 12px 40px
    rgba(0,0,0,.12);
}


/* HEADER */

.header{

    text-align:center;

    padding:28px 20px;

    color:#fff;

    background:
    linear-gradient(
        135deg,
        #ff4f81,
        #8e44ad
    );
}


.header i{

    font-size:42px;

    margin-bottom:8px;
}


.header h1{

    font-size:25px;

    font-weight:700;
}


.header p{

    margin-top:3px;

    font-size:14px;

    opacity:.9;
}


/* CONTENT */

.content{

    padding:20px;
}


/* SELECT BOX */

.upload-box{

    display:block;

    text-align:center;

    padding:30px 15px;

    border:
    2px dashed #d7d7d7;

    border-radius:18px;

    cursor:pointer;

    transition:.2s;
}


.upload-box:hover{

    border-color:#ff4f81;

    background:#fff8fa;
}


.upload-box i{

    color:#ff4f81;

    font-size:45px;

    margin-bottom:10px;
}


.upload-box h3{

    font-size:19px;

    margin-bottom:4px;
}


.upload-box p{

    color:#777;

    font-size:13px;
}


#fileInput{

    display:none;
}


/* PREVIEW */

.preview{

    display:none;

    position:relative;

    margin-top:18px;
}


.preview img{

    width:100%;

    max-height:330px;

    object-fit:contain;

    background:#f3f3f3;

    border-radius:15px;
}


.remove-btn{

    position:absolute;

    top:10px;

    right:10px;

    width:40px;

    height:40px;

    border:0;

    border-radius:50%;

    background:#e53935;

    color:#fff;

    cursor:pointer;
}


/* UPLOAD BUTTON */

.upload-btn{

    width:100%;

    padding:14px;

    margin-top:18px;

    border:0;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #ff4f81,
        #8e44ad
    );

    color:#fff;

    font-family:inherit;

    font-size:17px;

    font-weight:700;

    cursor:pointer;
}


.upload-btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* PROGRESS */

.progress-area{

    display:none;

    margin-top:18px;
}


.progress-info{

    display:flex;

    justify-content:space-between;

    margin-bottom:6px;

    font-size:13px;
}


.progress{

    width:100%;

    height:10px;

    overflow:hidden;

    border-radius:20px;

    background:#eee;
}


.progress-bar{

    width:0%;

    height:100%;

    background:
    linear-gradient(
        90deg,
        #ff4f81,
        #8e44ad
    );

    transition:.2s;
}


/* SUCCESS */

.success-box{

    display:none;

    margin-top:18px;

    padding:15px;

    border:
    1px solid #bceccc;

    border-radius:15px;

    background:#eafff1;

    color:#176b39;
}


.url-box{

    display:flex;

    gap:7px;

    margin-top:12px;
}


.url-box input{

    flex:1;

    min-width:0;

    padding:10px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:12px;
}


.copy-btn{

    padding:9px 12px;

    border:0;

    border-radius:10px;

    background:#673ab7;

    color:#fff;

    font-family:inherit;

    cursor:pointer;
}


.open-btn{

    width:100%;

    padding:11px;

    margin-top:10px;

    border:0;

    border-radius:10px;

    background:#00897b;

    color:#fff;

    font-family:inherit;

    cursor:pointer;
}


/* ERROR */

.error-box{

    display:none;

    margin-top:18px;

    padding:14px;

    border:
    1px solid #ffcaca;

    border-radius:14px;

    background:#fff0f0;

    color:#b42318;

    font-size:14px;
}


/* RESET */

.reset-btn{

    width:100%;

    padding:12px;

    margin-top:10px;

    border:
    1px solid #ddd;

    border-radius:12px;

    background:#fff;

    color:#555;

    font-family:inherit;

    cursor:pointer;
}


/* FOOTER */

.footer{

    padding:15px;

    border-top:1px solid #eee;

    text-align:center;

    color:#888;

    font-size:12px;
}

</style>

</head>


<body>


<div class="app">


<!-- HEADER -->

<div class="header">

<i class="fa-solid fa-cloud-arrow-up"></i>

<h1>
Rater Tara Image Upload
</h1>

<p>
Cloudinary Secure Image Upload
</p>

</div>



<div class="content">


<!-- IMAGE SELECT -->

<label
    class="upload-box"
    for="fileInput"
>

<i class="fa-regular fa-image"></i>

<h3>
ছবি নির্বাচন করুন
</h3>

<p>
JPG / PNG / WEBP
<br>
Maximum 5 MB
</p>

</label>


<input
    type="file"
    id="fileInput"
    accept="image/jpeg,image/png,image/webp"
>



<!-- PREVIEW -->

<div
    class="preview"
    id="preview"
>

<img
    id="previewImage"
    alt="Image Preview"
>


<button
    type="button"
    class="remove-btn"
    id="removeBtn"
>

<i class="fa-solid fa-xmark"></i>

</button>

</div>



<!-- UPLOAD -->

<button
    type="button"
    class="upload-btn"
    id="uploadBtn"
    disabled
>

<i class="fa-solid fa-cloud-arrow-up"></i>

ছবি আপলোড করুন

</button>



<!-- PROGRESS -->

<div
    class="progress-area"
    id="progressArea"
>

<div class="progress-info">

<span>
Uploading...
</span>

<span id="progressText">
0%
</span>

</div>


<div class="progress">

<div
    class="progress-bar"
    id="progressBar"
></div>

</div>

</div>



<!-- SUCCESS -->

<div
    class="success-box"
    id="successBox"
>

<strong>

<i class="fa-solid fa-circle-check"></i>

ছবি সফলভাবে আপলোড হয়েছে

</strong>


<div class="url-box">

<input
    type="text"
    id="imageUrl"
    readonly
>


<button
    type="button"
    class="copy-btn"
    id="copyBtn"
>

<i class="fa-regular fa-copy"></i>

Copy

</button>

</div>


<button
    type="button"
    class="open-btn"
    id="openBtn"
>

<i class="fa-solid fa-up-right-from-square"></i>

ছবি দেখুন

</button>

</div>



<!-- ERROR -->

<div
    class="error-box"
    id="errorBox"
></div>



<!-- RESET -->

<button
    type="button"
    class="reset-btn"
    id="resetBtn"
>

<i class="fa-solid fa-rotate-right"></i>

নতুন ছবি নির্বাচন করুন

</button>


</div>



<div class="footer">

© 2026 Rater Tara • All Rights Reserved

</div>


</div>



<script>


const fileInput =
document.getElementById("fileInput");

const preview =
document.getElementById("preview");

const previewImage =
document.getElementById("previewImage");

const uploadBtn =
document.getElementById("uploadBtn");

const removeBtn =
document.getElementById("removeBtn");

const progressArea =
document.getElementById("progressArea");

const progressBar =
document.getElementById("progressBar");

const progressText =
document.getElementById("progressText");

const successBox =
document.getElementById("successBox");

const errorBox =
document.getElementById("errorBox");

const imageUrl =
document.getElementById("imageUrl");

const copyBtn =
document.getElementById("copyBtn");

const openBtn =
document.getElementById("openBtn");

const resetBtn =
document.getElementById("resetBtn");


let selectedFile = null;


/*
=========================================================
FILE SELECT
=========================================================
*/

fileInput.addEventListener(
"change",
function(){

hideMessages();

const file =
this.files[0];


if(!file){

return;

}


const allowedTypes = [

"image/jpeg",
"image/png",
"image/webp"

];


if(!allowedTypes.includes(file.type)){

showError(
"শুধু JPG, PNG অথবা WEBP ছবি নির্বাচন করুন।"
);

resetUploader();

return;

}


if(file.size > 5 * 1024 * 1024){

showError(
"ছবির সাইজ সর্বোচ্চ 5 MB হতে পারবে।"
);

resetUploader();

return;

}


selectedFile = file;


const reader =
new FileReader();


reader.onload =
function(event){

previewImage.src =
event.target.result;

preview.style.display =
"block";

uploadBtn.disabled =
false;

};


reader.readAsDataURL(file);

});



/*
=========================================================
UPLOAD
=========================================================
*/

uploadBtn.addEventListener(
"click",
function(){

if(!selectedFile){

showError(
"প্রথমে একটি ছবি নির্বাচন করুন।"
);

return;

}


hideMessages();


uploadBtn.disabled =
true;


progressArea.style.display =
"block";


progressBar.style.width =
"0%";


progressText.textContent =
"0%";


const formData =
new FormData();


formData.append(
"file",
selectedFile
);


const xhr =
new XMLHttpRequest();


/*
UPLOAD PROGRESS
*/

xhr.upload.addEventListener(
"progress",
function(event){

if(event.lengthComputable){

const percent =
Math.round(
(event.loaded / event.total) * 100
);


progressBar.style.width =
percent + "%";


progressText.textContent =
percent + "%";

}

});



/*
UPLOAD COMPLETE
*/

xhr.addEventListener(
"load",
function(){

let response;


try{

response =
JSON.parse(
xhr.responseText
);

}

catch(error){

showError(
"Server থেকে সঠিক response পাওয়া যায়নি।"
);

uploadBtn.disabled =
false;

return;

}


if(
xhr.status >= 200 &&
xhr.status < 300 &&
response.success &&
response.secure_url
){

progressBar.style.width =
"100%";


progressText.textContent =
"100%";


imageUrl.value =
response.secure_url;


successBox.style.display =
"block";


uploadBtn.disabled =
true;

}

else{

let message =
response.message ||
"Cloudinary upload failed.";


if(
response.cloudinary_response &&
response.cloudinary_response.error &&
response.cloudinary_response.error.message
){

message +=
" " +
response.cloudinary_response.error.message;

}


showError(message);


uploadBtn.disabled =
false;

}

});



/*
NETWORK ERROR
*/

xhr.addEventListener(
"error",
function(){

showError(
"Server-এর সাথে সংযোগ করা যায়নি।"
);

uploadBtn.disabled =
false;

});



/*
TIMEOUT
*/

xhr.addEventListener(
"timeout",
function(){

showError(
"Upload timeout হয়েছে। আবার চেষ্টা করুন।"
);

uploadBtn.disabled =
false;

});



xhr.open(
"POST",
"upload.php",
true
);


xhr.timeout =
120000;


xhr.send(formData);

});



/*
=========================================================
REMOVE IMAGE
=========================================================
*/

removeBtn.addEventListener(
"click",
function(){

resetUploader();

});


resetBtn.addEventListener(
"click",
function(){

resetUploader();

});



/*
=========================================================
COPY URL
=========================================================
*/

copyBtn.addEventListener(
"click",
async function(){

if(!imageUrl.value){

return;

}


try{

await navigator.clipboard.writeText(
imageUrl.value
);


copyBtn.innerHTML =
'<i class="fa-solid fa-check"></i> Copied';


setTimeout(
function(){

copyBtn.innerHTML =
'<i class="fa-regular fa-copy"></i> Copy';

},
1500
);

}

catch(error){

imageUrl.select();

document.execCommand("copy");

}

});



/*
=========================================================
OPEN IMAGE
=========================================================
*/

openBtn.addEventListener(
"click",
function(){

if(imageUrl.value){

window.open(
imageUrl.value,
"_blank"
);

}

});



/*
=========================================================
RESET
=========================================================
*/

function resetUploader(){

selectedFile = null;

fileInput.value = "";

previewImage.src = "";

preview.style.display = "none";

uploadBtn.disabled = true;

progressArea.style.display = "none";

progressBar.style.width = "0%";

progressText.textContent = "0%";

successBox.style.display = "none";

errorBox.style.display = "none";

imageUrl.value = "";

}



/*
=========================================================
SHOW ERROR
=========================================================
*/

function showError(message){

errorBox.innerHTML =
'<i class="fa-solid fa-circle-exclamation"></i> ' +
message;

errorBox.style.display =
"block";

}



/*
=========================================================
HIDE MESSAGES
=========================================================
*/

function hideMessages(){

errorBox.style.display =
"none";

successBox.style.display =
"none";

}

</script>

</body>

</html>
