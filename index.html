<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rater Tara Image Upload</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Hind Siliguri", sans-serif;
            background: #f3f7f8;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            margin: auto;
            background: #fff;
        }

        .header {
            background: linear-gradient(135deg, #008b8b, #006666);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 23px;
        }

        .header p {
            font-size: 14px;
            opacity: .9;
        }

        .content {
            padding: 20px;
        }

        .card {
            padding: 18px;
            border-radius: 18px;
            border: 1px solid #eee;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #008b8b;
            border-radius: 12px;
            background: #f8ffff;
            font-family: inherit;
        }

        .preview {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        .preview img {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 14px;
            background: #f1f1f1;
        }

        .file-info {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: #f3f7f7;
            font-size: 14px;
        }

        .upload-btn {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #008b8b, #006666);
            color: white;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .upload-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .progress-box {
            display: none;
            margin-top: 18px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            font-size: 14px;
        }

        .progress {
            width: 100%;
            height: 10px;
            background: #e5eeee;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #008b8b;
            transition: width .2s;
        }

        .result {
            display: none;
            margin-top: 18px;
            padding: 15px;
            border-radius: 12px;
            word-break: break-all;
        }

        .success {
            background: #e9fff4;
            border: 1px solid #8ee5b8;
            color: #126b40;
        }

        .error {
            background: #fff0f0;
            border: 1px solid #ffaaaa;
            color: #a40000;
        }

        .url-box {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            font-size: 12px;
            color: #333;
        }

        .copy-btn,
        .open-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            border: 0;
            border-radius: 9px;
            background: #006666;
            color: white;
            text-align: center;
            text-decoration: none;
            font-family: inherit;
            cursor: pointer;
        }

        .note {
            margin-top: 16px;
            padding: 12px;
            background: #f7f7f7;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.7;
            color: #666;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <h1>Rater Tara Image Upload</h1>
        <p></p>
    </header>

    <main class="content">

        <div class="card">

            <label for="imageFile">
                ছবি নির্বাচন করুন
            </label>

            <input
                type="file"
                id="imageFile"
                accept="image/jpeg,image/png,image/webp,image/gif"
            >

            <div class="preview" id="previewBox">
                <img id="imagePreview" alt="Image Preview">
            </div>

            <div class="file-info" id="fileInfo"></div>

            <button
                class="upload-btn"
                id="uploadBtn"
                disabled
            >
                ছবি Upload করুন
            </button>

            <div class="progress-box" id="progressBox">

                <div class="progress-text">
                    <span>Uploading...</span>
                    <span id="progressText">0%</span>
                </div>

                <div class="progress">
                    <div
                        class="progress-bar"
                        id="progressBar"
                    ></div>
                </div>

            </div>

            <div
                class="result success"
                id="successBox"
            >
                <strong>✓ ছবি সফলভাবে Upload হয়েছে</strong>

                <div
                    class="url-box"
                    id="imageUrl"
                ></div>

                <button
                    class="copy-btn"
                    onclick="copyUrl()"
                >
                    Image URL Copy করুন
                </button>

                <a
                    id="openImage"
                    class="open-btn"
                    href="#"
                    target="_blank"
                    rel="noopener"
                >
                    ছবি দেখুন
                </a>
            </div>

            <div
                class="result error"
                id="errorBox"
            ></div>

            <div class="note">
                
            </div>

        </div>

    </main>

    <footer class="footer">
        
    </footer>

</div>


<script>

/* =========================================
   CLOUDINARY CONFIG
========================================= */

const CLOUDINARY_CLOUD_NAME = "rawaad4u";

/*
   Cloudinary Dashboard-এ তৈরি করা
   Unsigned Image Upload Preset-এর নাম দিন
*/
const CLOUDINARY_UPLOAD_PRESET = "rater_tara_image";


/*
   IMAGE upload URL
*/
const CLOUDINARY_UPLOAD_URL =
    "https://api.cloudinary.com/v1_1/" +
    CLOUDINARY_CLOUD_NAME +
    "/image/upload";


/* =========================================
   ELEMENTS
========================================= */

const imageFile =
    document.getElementById("imageFile");

const uploadBtn =
    document.getElementById("uploadBtn");

const previewBox =
    document.getElementById("previewBox");

const imagePreview =
    document.getElementById("imagePreview");

const fileInfo =
    document.getElementById("fileInfo");

const progressBox =
    document.getElementById("progressBox");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const successBox =
    document.getElementById("successBox");

const errorBox =
    document.getElementById("errorBox");

const imageUrl =
    document.getElementById("imageUrl");

const openImage =
    document.getElementById("openImage");


let selectedFile = null;
let uploadedUrl = "";


/* =========================================
   IMAGE SELECT
========================================= */

imageFile.addEventListener("change", function () {

    selectedFile = this.files[0];

    successBox.style.display = "none";
    errorBox.style.display = "none";

    if (!selectedFile) {

        uploadBtn.disabled = true;
        previewBox.style.display = "none";
        fileInfo.style.display = "none";

        return;
    }


    /* Image check */

    if (!selectedFile.type.startsWith("image/")) {

        showError(
            "অনুগ্রহ করে একটি ছবি নির্বাচন করুন।"
        );

        this.value = "";
        uploadBtn.disabled = true;

        return;
    }


    /* File size */

    const sizeMB =
        selectedFile.size / (1024 * 1024);


    /* Preview */

    const objectURL =
        URL.createObjectURL(selectedFile);

    imagePreview.src = objectURL;

    previewBox.style.display = "block";


    /* File information */

    fileInfo.innerHTML =
        "<b>ফাইল:</b> " +
        escapeHtml(selectedFile.name) +
        "<br>" +
        "<b>Size:</b> " +
        sizeMB.toFixed(2) +
        " MB";

    fileInfo.style.display = "block";


    uploadBtn.disabled = false;

});


/* =========================================
   UPLOAD BUTTON
========================================= */

uploadBtn.addEventListener("click", function () {

    if (!selectedFile) {

        showError(
            "প্রথমে একটি ছবি নির্বাচন করুন।"
        );

        return;
    }

    uploadToCloudinary();

});


/* =========================================
   CLOUDINARY IMAGE UPLOAD
========================================= */

function uploadToCloudinary() {

    uploadBtn.disabled = true;

    successBox.style.display = "none";
    errorBox.style.display = "none";

    progressBox.style.display = "block";

    progressBar.style.width = "0%";
    progressText.textContent = "0%";


    const formData = new FormData();

    formData.append(
        "file",
        selectedFile
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const xhr = new XMLHttpRequest();


    xhr.open(
        "POST",
        CLOUDINARY_UPLOAD_URL,
        true
    );


    /* =====================================
       UPLOAD PROGRESS
    ===================================== */

    xhr.upload.addEventListener(
        "progress",
        function (event) {

            if (event.lengthComputable) {

                const percent =
                    Math.round(
                        (event.loaded / event.total) * 100
                    );

                progressBar.style.width =
                    percent + "%";

                progressText.textContent =
                    percent + "%";
            }

        }
    );


    /* =====================================
       RESPONSE
    ===================================== */

    xhr.onreadystatechange = function () {

        if (xhr.readyState !== 4) {
            return;
        }

        uploadBtn.disabled = false;


        let data;

        try {

            data =
                JSON.parse(xhr.responseText);

        } catch (error) {

            showError(
                "Cloudinary থেকে সঠিক response পাওয়া যায়নি।"
            );

            return;
        }


        /* SUCCESS */

        if (
            xhr.status >= 200 &&
            xhr.status < 300
        ) {

            uploadedUrl =
                data.secure_url || "";


            if (!uploadedUrl) {

                showError(
                    "Upload হয়েছে, কিন্তু Image URL পাওয়া যায়নি।"
                );

                return;
            }


            progressBar.style.width =
                "100%";

            progressText.textContent =
                "100%";


            imageUrl.textContent =
                uploadedUrl;

            openImage.href =
                uploadedUrl;

            successBox.style.display =
                "block";


            console.log(
                "Cloudinary Image URL:",
                uploadedUrl
            );


        } else {

            const message =
                data?.error?.message ||
                "Cloudinary image upload failed.";

            showError(message);
        }

    };


    /* NETWORK ERROR */

    xhr.onerror = function () {

        uploadBtn.disabled = false;

        showError(
            "Internet connection অথবা Cloudinary connection সমস্যা হয়েছে।"
        );

    };


    xhr.ontimeout = function () {

        uploadBtn.disabled = false;

        showError(
            "Upload timeout হয়েছে। আবার চেষ্টা করুন।"
        );

    };


    xhr.timeout =
        10 * 60 * 1000;


    xhr.send(formData);

}


/* =========================================
   COPY URL
========================================= */

async function copyUrl() {

    if (!uploadedUrl) {
        return;
    }

    try {

        await navigator.clipboard.writeText(
            uploadedUrl
        );

        alert(
            "Image URL Copy হয়েছে।"
        );

    } catch (error) {

        alert(
            "URL Copy করা যায়নি।"
        );

    }

}


/* =========================================
   ERROR
========================================= */

function showError(message) {

    errorBox.textContent =
        "✕ " + message;

    errorBox.style.display =
        "block";

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
